# Weekly dependency updates. Major versions arrive one pull request each, so
# each can be judged on its own (the Arrow crates together, as one); everything
# smaller arrives together.
version: 2
updates:
  - package-ecosystem: cargo
    # The workspace root: one Cargo.lock resolves every member crate.
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request for every minor and patch update. Crates that must
      # share a version, like the Arrow ones, therefore move together.
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # The Arrow crates share one exact version (the doctors refuse a mix),
      # so a new major must move all of them in one pull request.
      arrow-major:
        patterns:
          - "arrow"
          - "arrow-*"
        update-types:
          - major
    ignore:
      # pyo3 0.30 drops `abi3-py38`. The wheels are built for Python 3.8 and
      # later, so that upgrade waits for a decision to raise the floor.
      - dependency-name: "pyo3*"
        versions:
          - ">=0.30"
      # napi-derive 3 generates code only the napi 3 runtime accepts, so the
      # two move together or not at all. The workspace keeps napi 2 because
      # the consumer shells load the `.node` files it builds (Cargo.toml says
      # why). A trial on 2026-11-13 found nine of the ten Node crates compile
      # on napi 3 unchanged; geo-fast-node reads typed arrays through
      # `JsUnknown`, `JsTypedArray` and `JsObject`, which napi 3 removes, and
      # needs that reader rewritten. Unblocked when the consumer shells accept
      # a napi 3 build and that rewrite lands with scripts/smoke-node.mjs and
      # scripts/check-node-types.mjs passing.
      - dependency-name: "napi"
        versions:
          - ">=3"
      - dependency-name: "napi-derive"
        versions:
          - ">=3"
      # tiny-skia 0.12 rasterizes differently: on 2026-11-13, 12 of the 2551
      # PNGs pdf-fast-core's tests render came out changed (a two-pixel strip
      # that 0.11 left white is light grey, 239 of 255), so
      # `page_rasterized_png` would no longer return the same bytes for the
      # same page. Unblocked by a review that accepts the new rendering, with
      # a before-and-after pixel comparison of the raster tests in the
      # upgrade's pull request.
      - dependency-name: "tiny-skia"
        versions:
          - ">=0.12"
      # hayro 0.6 and later changes what pdf-fast-core's render guard
      # (src/render_guard.rs) mirrors. A trial of 0.9.0 on 2026-11-13 found:
      # resources no longer fall back name by name (`Resources::from_parent`
      # is gone); an ExtGState `/Font` now selects a Type 3 font the guard
      # never walks, and a chain of 20,000 of them overflowed the 64 MiB
      # render stack and aborted the process through the guarded entry; a
      # tiling cell now runs its content once per copy, and a 0.004 step ran
      # past 45 s and 578 MB; annotation appearance-state dictionaries are
      # drawn; and the guard's stack cost per level was measured on 0.5.
      # Unblocked by porting the guard to 0.9's model with those routes
      # bounded, re-measuring the costs with `probe_interpreter_stack`, and a
      # before-and-after pixel comparison in the upgrade's pull request.
      - dependency-name: "hayro"
        versions:
          - ">=0.6"
      # Arrow is pinned to the version the consumers use (Cargo.toml says
      # why), and flight-ipc-config reports it to them as
      # CAPABILITY_ARROW_VERSION, so a new major is the consumers' move first.
      # A trial of 60.1.0 on 2026-11-13 (`cargo check` with the CI Arrow
      # features) compiles everywhere; pdf-fast-py's
      # `ArrowArrayStreamReader` is deprecated, which `-D warnings` turns
      # into an error. Unblocked when the consumers take the new major: move
      # the five pins, CAPABILITY_ARROW_VERSION and README.md together, rename
      # that reader, and show the schema snapshots and pyarrow interop pass.
      # The `arrow-major` group above stays, so that upgrade arrives whole.
      - dependency-name: "arrow*"
        versions:
          - ">=59"
      # mailparse 0.18 splits a message differently: it drops the line break
      # before each MIME boundary from the part above it, finds a boundary
      # that ends the message (0.15 missed it), treats every `multipart*`
      # type as multipart, splits Content-Type parameters around quoted
      # semicolons and refuses nesting past 100 levels. On 2026-11-13, 8 of
      # 14 real .eml files parsed to different JSON (`body` in all 8,
      # `attachments` in 2), as did 3394 of the 23797 parses email-fast-core's
      # tests make (`body`, `attachments`, `to`, `cc`, `from`), and
      # `mime_depth_walk_agrees_with_mailparse` failed: the crate's nesting
      # walk (`find_bytes`) replays 0.15's boundary search, quirk included,
      # and its header-cost bound was measured on 0.15. Unblocked by
      # re-deriving the walk and re-measuring the bound against the new
      # version, and a review that accepts the new output, with a
      # before-and-after JSON comparison in the upgrade's pull request.
      - dependency-name: "mailparse"
        versions:
          - ">=0.16"
      # tiff 0.10 and later reads a raster differently, and geo-fast-core's
      # bands follow 0.9. On 2026-11-13, 0.11.3 against GDAL's 237 test
      # TIFFs (autotest/gcore/data) gave:
      # - an RGB raster whose fourth sample is an unspecified extra sample
      #   lost that band, which is how RGB+NIR imagery is stored, and the
      #   decoder has no option to keep it;
      # - 11 JPEG-compressed rasters changed pixels (jpeg-decoder became
      #   zune-jpeg): 8 by at most 1 of 255, and the 3 in YCbCr by a mean
      #   of 11 to 66 of 255, with no reference yet for which is right;
      # - a `fax` (Group 4) codec is on by default.
      # It also decoded 9 rasters 0.9 refuses and words its errors
      # differently. Unblocked by keeping every sample of such a raster (or
      # reading its chunks directly), settling the YCbCr colours against
      # GDAL, and a before-and-after band comparison in the upgrade's pull
      # request.
      - dependency-name: "tiff"
        versions:
          - ">=0.10"
      # libdeflater 1.x bundles a libdeflate whose AVX-512 VNNI adler32 does
      # not compile under the zig clang the release builds its manylinux
      # x86_64 wheels with ("requires target feature 'evex512'"). 1.26 passed
      # CI, whose Linux wheel leg then built natively, and failed the
      # v2026.11.13.1 tag. That leg now builds through zig with the release's
      # pins, so unblocking needs only a version that passes it.
      - dependency-name: "libdeflater"
        versions:
          - ">=1"

  - package-ecosystem: cargo
    # The repository doctors: a package outside the workspace, with its own
    # Cargo.lock that the entry above never reads.
    directory: /.leio-code/rust-doctors
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      doctors-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Every action is pinned by commit SHA with its version in a trailing
    # comment; Dependabot moves both.
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
