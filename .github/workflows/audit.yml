# Known advisories against the crates in Cargo.lock, from the RustSec database.
# The repository doctors are a separate package with a lockfile of their own
# (.leio-code/rust-doctors/Cargo.lock); it is scanned the same way.
#
# This is its own workflow, and ci.yml must never call it or run the scan
# itself: release.yml calls ci.yml, and an advisory published against a
# dependency must not block the release of an unrelated fix. It runs weekly
# because an advisory arrives on the database's schedule and not on a commit's,
# and on any pull request that changes what the lockfile resolves.
#
# No advisory is ignored. A finding is answered by upgrading the dependency.
#
# `cargo-deny` checks the policy in deny.toml on the same triggers: which
# licences a dependency may carry, that every crate comes from crates.io, and
# the advisories once more through a second tool.
name: audit

on:
  schedule:
    # Mondays, 06:23 UTC.
    - cron: "23 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - .leio-code/rust-doctors/Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - deny.toml

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Fail on a vulnerability or an unsoundness advisory
        # A vulnerability fails the scan by default; `--deny unsound` makes an
        # unsoundness advisory, which is otherwise only a warning, fail it too.
        run: cargo audit --deny unsound

  cargo-audit-doctors:
    # A job of its own, not a later step of the one above: a step is skipped
    # once an earlier step fails, so a finding in the workspace would hide
    # whatever the doctors' lockfile holds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Fail on a vulnerability or an unsoundness advisory in the doctors' lockfile
        run: cargo audit --deny unsound --file .leio-code/rust-doctors/Cargo.lock

  cargo-deny:
    # A job of its own for the same reason: a licence or source finding must
    # report even when an advisory has already failed a scan above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licences, duplicate versions and sources against deny.toml
        run: cargo deny --locked check
