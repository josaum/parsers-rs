[package]
name = "parsers-doctors"
version = "0.1.0"
edition = "2024"
# The repository's licence. cargo-deny checks this package against deny.toml
# like the workspace, and refuses a package with no licence at all.
license = "MIT OR Apache-2.0"
publish = false
[workspace]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A pure-Rust YAML parser. serde_yaml is unmaintained and brings
# unsafe-libyaml (RUSTSEC-2024-0449, unsound, no fixed version). The doctors
# read a handful of keys from ci.yml, so a generic value is all they need.
yaml-rust2 = { version = "0.13", default-features = false }
toml = "1.2"
[dev-dependencies]
tempfile = "3"
