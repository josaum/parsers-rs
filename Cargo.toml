[workspace]
resolver = "2"
members = [
  "docx-fast-core",
  "docx-fast-py",
  "docx-fast-node",
  "docx-fast-flight",
  "ooxml-archive",
  "xlsx-fast-core",
  "xlsx-fast-py",
  "xlsx-fast-node",
  "xlsx-fast-flight",
  "xlsx-fast-write",
  "xlsx-fast-write-py",
  "xlsx-fast-write-node",
  "pptx-fast-core",
  "pptx-fast-py",
  "pptx-fast-node",
  "pptx-fast-flight",
  "pdf-fast-core",
  "pdf-fast-py",
  "pdf-fast-node",
  "pdf-fast-write",
  "pdf-fast-write-py",
  "pdf-fast-write-node",
  "email-fast-core",
  "email-fast-py",
  "email-fast-node",
  "email-fast-flight",
  "json-fast-core",
  "json-fast-py",
  "json-fast-node",
  "json-fast-flight",
  "xsd-fast-core",
  "xsd-fast-py",
  "xsd-fast-node",
  "xsd-fast-flight",
  "ontology-fast-core",
  "ontology-fast-py",
  "web-fast-core",
  "geo-fast-core",
  "geo-fast-py",
  "geo-fast-node",
  "flight-ipc-config",
]

# Shared dependency versions for every parser crate in this repository.
#
# These are pinned exactly where a wire or contract format is involved, so a
# consumer's bytes cannot shift under a caret range. `arrow*` is pinned to the
# same version the consumers already use: an Arrow IPC payload
# written here must be readable there without a conversion step.
[workspace.dependencies]
arrow-array = "=58.4.1"
arrow = "=58.4.1"
arrow-flight = "=58.4.1"
arrow-ipc = { version = "=58.4.1", features = ["lz4", "zstd"] }
arrow-schema = "=58.4.1"
# jsonwebtoken (10 and 11) has no built-in crypto: one backend feature must be
# on, or signing and verifying panic at run time. `aws_lc_rs` is the choice
# because `rust_crypto` pulls `rsa` 0.9, which carries RUSTSEC-2023-0071 with
# no fix on that line, and the audit ignores no advisory. Keep the feature
# here, on the one shared line, so no member can turn on a second backend.
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py38", "generate-import-lib"] }
# Node-API 2 bindings. napi 2 is the line the consumer shells were built
# against; the `.node` ABI is what the consumer shells load, so the major
# stays put until every shell moves with it.
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
napi-build = "2.2"
regex = "1.12"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14.2", features = ["transport"] }

# Inherited by every member that does not override it. Attribution stays with
# this repository: a consumer must be able to tell which project produced an
# artifact, and an artifact that names its consumer cannot.
[workspace.package]
authors = ["Dionisio Chiuratto Agourakis"]
edition = "2021"
license = "MIT OR Apache-2.0"
# Every published artifact inherits this remote, so it must never point at a
# consumer of this repository.
repository = "https://github.com/josaum/parsers-rs"
rust-version = "1.94"

# Lints every member inherits through `[lints] workspace = true`. Each `unsafe`
# block, and each `unsafe impl`, says why it is sound in a `// SAFETY:`
# comment, and an `unsafe fn` marks each unsafe operation in its body with a
# block of its own, so that operation carries the same comment.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
