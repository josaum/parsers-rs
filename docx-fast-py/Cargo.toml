[package]
name = "docx-fast-py"
version = "0.2.9"
edition.workspace = true
authors.workspace = true
description = "Python bindings for docx-fast-core"
license.workspace = true
rust-version.workspace = true

[lib]
name = "docx_fast_py"
crate-type = ["cdylib"]

[dependencies]
docx-fast-core = { path = "../docx-fast-core", features = ["arrow"] }
pyo3 = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.29.3"

[lints]
workspace = true
