[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "docx-fast"
version = "0.2.5"
description = "High-performance Word (.docx) parser powered by Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Dionisio Chiuratto Agourakis" }]
keywords = [
    "word",
    "docx",
    "document",
    "parser",
    "office",
    "ooxml",
    "rust",
    "performance",
    "arrow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/yourorg/office-parsers-rs"
Repository = "https://github.com/yourorg/office-parsers-rs/tree/main/docx-fast-py"
Documentation = "https://github.com/yourorg/office-parsers-rs#readme"
"Bug Tracker" = "https://github.com/yourorg/office-parsers-rs/issues"

[tool.maturin]
module-name = "docx_fast._core"
python-source = "."
features = ["pyo3/extension-module"]
