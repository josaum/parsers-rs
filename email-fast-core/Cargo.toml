[package]
name = "email-fast-core"
version = "0.2.11"
edition.workspace = true
authors.workspace = true
description = "High-performance email parser for .eml and .msg formats"
license.workspace = true
rust-version.workspace = true
# Benchmarks and the one-shot bench drivers are for this repository, not for
# users of the crate: they stay out of the published package.
exclude = ["benches/", "examples/"]
keywords = ["email", "eml", "msg", "outlook", "parser", "mime"]
categories = ["parser-implementations", "email"]

[lib]
name = "email_fast_core"

# `arrow` emits the Arrow IPC contract. The GLiNER and embed-service integrations
# that lived here are consumer concerns and stay in the consumer repository: a
# shared parser cannot depend on one product's SDK.
[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc"]

[dependencies]
anyhow = "1.0"
arrow-array = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Email parsing
mailparse = "0.18"
charset = "0.1"
quoted_printable = "0.5"
base64 = { version = "0.23", default-features = false, features = ["std"] }

# MSG file parsing (OLE Compound File Binary — raw FAT/mini-FAT, no crate)
encoding_rs = "0.8"
# HTML named character references (the full table from the HTML standard) for
# `html_to_text`; already in the workspace lockfile through html5ever.
web_atoms = "0.3"
regex = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.10"

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
