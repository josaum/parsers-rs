[package]
name = "email-fast-core"
version = "0.2.2"
edition.workspace = true
authors.workspace = true
description = "High-performance email parser for .eml and .msg formats"
license.workspace = true
rust-version.workspace = true
keywords = ["email", "eml", "msg", "outlook", "parser", "mime"]
categories = ["parser-implementations", "email"]

[lib]
name = "email_fast_core"

# `arrow` emits the Arrow IPC contract. The GLiNER and mycelia-api integrations
# that lived here are consumer concerns and stay in the consumer repository: a
# shared parser cannot depend on one product's SDK.
[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc"]

[dependencies]
anyhow = "1.0"
arrow-array = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Email parsing
mailparse = "0.15"
charset = "0.1"
quoted_printable = "0.5"
base64 = "0.22"

# MSG file parsing (OLE Compound File Binary — raw FAT/mini-FAT, no crate)
encoding_rs = "0.8"
regex = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
