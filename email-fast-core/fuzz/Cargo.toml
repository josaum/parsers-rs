[package]
name = "email-fast-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
email-fast-core = { path = ".." }
serde_json = "1.0"

[[bin]]
name = "eml"
path = "fuzz_targets/eml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mbox"
path = "fuzz_targets/mbox.rs"
test = false
doc = false
bench = false

[[bin]]
name = "msg"
path = "fuzz_targets/msg.rs"
test = false
doc = false
bench = false

# Standalone fuzz crate: intentionally outside the office-parsers-rs
# workspace (members are explicit) and outside any parent workspace, so the
# workspace lockfile and build never see libFuzzer.
[workspace]
