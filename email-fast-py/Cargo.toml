[package]
name = "email-fast-py"
version = "0.2.9"
edition.workspace = true
authors.workspace = true
description = "Python bindings for email-fast-core"
license.workspace = true
rust-version.workspace = true

[lib]
name = "email_fast_py"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
pyo3 = { workspace = true }
serde_json = { workspace = true }
email-fast-core = { path = "../email-fast-core", features = ["arrow"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
