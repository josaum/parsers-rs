[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "email-fast"
version = "0.2.10"
description = "High-performance email parser for .eml, .msg, and mbox formats"
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Dionisio Chiuratto Agourakis" }]

[project.urls]
Homepage = "https://github.com/josaum/parsers-rs"
Repository = "https://github.com/josaum/parsers-rs/tree/main/email-fast-py"
Documentation = "https://github.com/josaum/parsers-rs#readme"
"Bug Tracker" = "https://github.com/josaum/parsers-rs/issues"

[project.optional-dependencies]
arrow = []

[tool.maturin]
module-name = "email_fast._core"
python-source = "."
features = ["pyo3/extension-module"]
