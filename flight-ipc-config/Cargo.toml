[package]
name = "flight-ipc-config"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
# Not used directly. jsonwebtoken's `aws_lc_rs` backend builds AWS-LC, whose
# x86_64 Windows assembly needs NASM. This feature lets that one target fall
# back to the assembled objects the crate ships when NASM is not installed; it
# changes nothing on other targets or where NASM is present.
aws-lc-rs = { version = "1.15", default-features = false, features = ["prebuilt-nasm"] }
futures = "0.3"
jsonwebtoken = { workspace = true }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = "0.1"
tonic = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
