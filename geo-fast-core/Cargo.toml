[package]
name = "geo-fast-core"
version = "0.2.3"
edition.workspace = true
authors.workspace = true
description = "GIS format parser: GeoTIFF, Shapefile, GeoJSON, WMS/WFS client"
license.workspace = true
repository.workspace = true
keywords = ["gis", "geospatial", "geotiff", "shapefile", "geojson", "wms", "wfs"]
categories = ["science::geo", "parser-implementations", "encoding"]
rust-version.workspace = true
exclude = ["benches/", "examples/"]

[lib]
name = "geo_fast_core"

[features]
default = []
http = ["dep:reqwest", "dep:tokio", "dep:encoding_rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1"
tiff = "0.9"
quick-xml = "0.41"

# reqwest 0.13 changed its default TLS backend from native-tls to rustls. The
# features below are the ones 0.12's defaults enabled: the platform's own TLS
# library (without ALPN, as before), charset decoding, HTTP/2 and the system
# proxy settings.
[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "native-tls-no-alpn", "charset", "http2", "system-proxy"]
optional = true

# Already built for reqwest's `charset` feature: it decodes a capabilities
# response in the character set its `Content-Type` names, as
# `reqwest::Response::text` does, once the body has been read under a cap.
[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros"]
optional = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Without the default features: no plots and no rayon, only what a
# `cargo bench` run needs.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false
