[package]
name = "json-fast-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
json-fast-core = { path = ".." }
serde_json = "1.0"

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_schema_validate"
path = "fuzz_targets/json_schema_validate.rs"
test = false
doc = false
bench = false

# Standalone fuzz crate: intentionally outside the office-parsers-rs
# workspace (members are explicit) and outside any parent workspace, so the
# workspace lockfile and build never see libFuzzer.
[workspace]
