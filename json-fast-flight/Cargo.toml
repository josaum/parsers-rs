[package]
name = "json-fast-flight"
version = "0.1.4"
edition.workspace = true
authors.workspace = true
description = "Arrow Flight server that streams JSON / JSONL files as Apache Arrow RecordBatches"
license.workspace = true
repository.workspace = true
keywords = ["json", "jsonl", "ndjson", "arrow", "flight", "grpc"]
categories = ["parser-implementations", "web-programming"]
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
arrow-array = { workspace = true }
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
flight-ipc-config = { path = "../flight-ipc-config" }
futures = "0.3"
json-fast-core = { path = "../json-fast-core", features = ["arrow"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tonic = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true }
tempfile = "3.10"

[lints]
workspace = true
