[package]
name = "ontology-fast-core"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
description = "Canonical Turtle reader and indexed triple view"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["turtle", "rdf", "ontology", "parser"]
categories = ["parser-implementations"]

[dependencies]
oxrdf = { version = "0.3", features = ["rdf-12"] }
# The Turtle parser alone, not `oxrdfio`: that crate also links the RDF/XML and
# JSON-LD readers, which this crate never calls.
oxttl = { version = "0.2.5", default-features = false, features = ["rdf-12"] }
thiserror = "2.0"
