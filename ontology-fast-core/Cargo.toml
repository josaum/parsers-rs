[package]
name = "ontology-fast-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Canonical Turtle reader and indexed triple view"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["turtle", "rdf", "ontology", "parser"]
categories = ["parser-implementations"]

[dependencies]
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxrdfio = { version = "0.2.5", default-features = false, features = ["rdf-12"] }
thiserror = "2.0"
