[package]
name = "ooxml-archive"
version = "0.1.7"
edition.workspace = true
authors.workspace = true
description = "Shared OOXML ZIP archive, inflate, and relationship helpers"
license.workspace = true
keywords = ["ooxml", "zip", "office", "parser"]
categories = ["parser-implementations", "encoding"]
rust-version.workspace = true
# Benchmarks and the one-shot bench drivers are for this repository, not for
# users of the crate: they stay out of the published package.
exclude = ["benches/", "examples/"]

[lib]
name = "ooxml_archive"

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
memmap2 = "0.9"
quick-xml = "0.41"
rawzip = "0.5.2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.10"
tempfile = "3.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bench]]
name = "archive"
harness = false

[lints]
workspace = true
