[package]
name = "ooxml-archive"
version = "0.1.6"
edition.workspace = true
authors.workspace = true
description = "Shared OOXML ZIP archive, inflate, and relationship helpers"
license.workspace = true
keywords = ["ooxml", "zip", "office", "parser"]
categories = ["parser-implementations", "encoding"]
rust-version.workspace = true

[lib]
name = "ooxml_archive"

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
memmap2 = "0.9"
quick-xml = "0.36"
rawzip = "0.4.3"

[dev-dependencies]
proptest = "1.10"
tempfile = "3.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
