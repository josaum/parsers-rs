[package]
name = "pdf-fast-node"
version = "0.2.6"
edition.workspace = true
authors.workspace = true
description = "Node.js bindings for pdf-fast-core"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pdf_fast_node"
crate-type = ["cdylib"]

[features]
default = []
reading-order = []

[dependencies]
anyhow = "1.0"
arrow = { workspace = true, features = ["ffi", "ipc"] }
napi = { workspace = true }
napi-derive = { workspace = true }
pdf-fast-core = { path = "../pdf-fast-core", features = ["arrow"] }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
