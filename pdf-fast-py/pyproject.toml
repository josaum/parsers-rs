[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "pdf-fast"
version = "0.2.9"
description = "High-performance PDF parser powered by Rust"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Dionisio Chiuratto Agourakis" }]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=25.0.1",  # IPC reader floor for Rust arrow* =58.4.1
]
keywords = [
    "pdf",
    "parser",
    "document",
    "rust",
    "performance",
    "arrow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/josaum/parsers-rs"
Repository = "https://github.com/josaum/parsers-rs/tree/main/pdf-fast-py"
Documentation = "https://github.com/josaum/parsers-rs#readme"
"Bug Tracker" = "https://github.com/josaum/parsers-rs/issues"

[tool.maturin]
module-name = "pdf_fast._core"
python-source = "."
features = ["pyo3/extension-module"]

[project.optional-dependencies]
# Reading order needs the consumer's layout engine; see the `reading-order`
# feature note in Cargo.toml. The shared wheel is built without it.
reading-order = []
