[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "pdf-fast-write"
version = "0.2.3"
description = "Sovereign PDF page subsetter powered by Rust (no external deps)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Dionisio Chiuratto Agourakis" }]
keywords = ["pdf", "writer", "subset", "manipulation", "office", "rust"]

[tool.maturin]
module-name = "pdf_fast_write._core"
python-source = "."
features = ["pyo3/extension-module"]
