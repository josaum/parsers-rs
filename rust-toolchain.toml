# One pinned stable for every Rust project in this workspace family: the same
# version here, in Atlas and in Mycelia, updated deliberately and together.
# A floating `stable` made CI depend on whichever compiler the runner had
# that day; an unpinned pin drifts between projects. Bump in its own commit
# and re-verify.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
