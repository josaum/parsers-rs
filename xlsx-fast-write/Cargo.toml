[package]
name = "xlsx-fast-write"
version = "0.2.4"
edition.workspace = true
authors.workspace = true
description = "Sovereign XLSX writer — generates .xlsx files without external dependencies"
license.workspace = true
repository.workspace = true
keywords = ["xlsx", "excel", "writer", "ooxml", "office"]
categories = ["encoding", "api-bindings"]
rust-version.workspace = true
exclude = ["benches/", "examples/"]

[lib]
name = "xlsx_fast_write"

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
quick-xml = "0.42"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
xlsx-fast-core = { path = "../xlsx-fast-core" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "write"
harness = false

[lints]
workspace = true
