[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "xsd-fast"
version = "0.2.8"
description = "High-performance XSD schema parser with Arrow schema derivation and XML validation, powered by Rust"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Dionisio Chiuratto Agourakis" }]
keywords = [
    "xsd",
    "xml-schema",
    "xml",
    "validation",
    "arrow",
    "parser",
    "rust",
    "performance",
    "schema",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.urls]
Homepage = "https://github.com/josaum/parsers-rs"
Repository = "https://github.com/josaum/parsers-rs/tree/main/xsd-fast-py"
Documentation = "https://github.com/josaum/parsers-rs#readme"
"Bug Tracker" = "https://github.com/josaum/parsers-rs/issues"

[tool.maturin]
module-name = "xsd_fast._core"
python-source = "."
features = ["pyo3/extension-module"]
